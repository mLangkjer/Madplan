<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Interaktive Madplan & Opskrifter</title>
  <style>
    :root {
      --primary: #4CAF50;
      --primary-hover: #45a049;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .header-nav {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      background: #e0e0e0;
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1, h2, h3 { color: #2c3e50; margin-top: 0; }

    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }

    /* Ugeplan Styling */
    .day-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .day-label {
      width: 90px;
      font-weight: bold;
      color: #2c3e50;
    }

    .day-select {
      flex-grow: 1;
      margin-bottom: 0;
    }

    .view-recipe-btn {
      width: auto;
      margin-bottom: 0;
      padding: 8px 12px;
      font-size: 12px;
      background-color: #3498db;
    }

    /* Bibliotek Grid */
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .recipe-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .recipe-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .recipe-card-body {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .shopping-list {
      background: #eef9f1;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #c8e6c9;
    }

    .extra-item-form {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .extra-item-form input { margin-bottom: 0; flex-grow: 1; }
    .extra-item-form button { width: auto; margin-bottom: 0; white-space: nowrap; }

    /* Modal / Popup til Opskrift */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .delete-btn { background: #e74c3c; }
  </style>
</head>
<body>

  <h1 style="text-align: center;">🥗 Min Madplan & Opskrifter</h1>

  <!-- Navigation -->
  <div class="header-nav">
    <button class="tab-btn active" onclick="switchTab('plannerTab')">📅 Ugeplan & Indkøb</button>
    <button class="tab-btn" onclick="switchTab('libraryTab')">📖 Opskriftsbibliotek</button>
  </div>

  <!-- FANE 1: UGEPLAN & INDKØB -->
  <div id="plannerTab" class="tab-content active">
    <div class="container">
      
      <!-- Ugeplanen -->
      <div class="card">
        <h2>Ugens Menu</h2>
        <div id="weekDaysContainer"></div>
        <button onclick="generateShoppingList()" style="margin-top: 15px; background-color: #3498db;">Generer Indkøbsliste 🛒</button>
      </div>

      <!-- Opret Opskrift -->
      <div class="card">
        <h2>Opret Ny Opskrift</h2>
        <form id="recipeForm">
          <input type="text" id="title" placeholder="Retten navn (f.eks. Lasagne)" required>
          <input type="url" id="link" placeholder="Link til opskrift på nettet (valgfrit)">
          <input type="url" id="imageUrl" placeholder="Billede-URL (valgfrit)">
          <textarea id="ingredients" rows="4" placeholder="Ingredienser (én pr. linje):&#10;500g oksekød&#10;1 løg" required></textarea>
          <button type="submit">Gem i Bibliotek</button>
        </form>
      </div>

      <!-- Indkøbsliste -->
      <div class="card" style="grid-column: span 2;">
        <h2>Din Indkøbsliste</h2>
        <div class="extra-item-form">
          <input type="text" id="extraIngredient" placeholder="Tilføj ekstra vare (f.eks. Mælk)...">
          <button onclick="addExtraIngredient()" style="background-color: #e67e22;">+ Tilføj vare</button>
        </div>
        <div id="shoppingListContainer" class="shopping-list">
          <p>Vælg retter til ugen og tryk på "Generer Indkøbsliste".</p>
        </div>
      </div>

    </div>
  </div>

  <!-- FANE 2: OPKRIFTSBIBLIOTEK -->
  <div id="libraryTab" class="tab-content">
    <div class="container" style="grid-template-columns: 1fr;">
      <div class="card">
        <h2>Dine Gemte Opskrifter</h2>
        <input type="text" id="searchBar" onkeyup="searchRecipes()" placeholder="🔍 Søg efter opskrift...">
        <div id="libraryGrid" class="library-grid"></div>
      </div>
    </div>
  </div>

  <!-- MODAL / POPUP TIL OPKRIFT -->
  <div id="recipeModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <img id="modalImage" src="" alt="" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px;">
      <h3>Ingredienser:</h3>
      <ul id="modalIngredients"></ul>
      <div id="modalLinkContainer"></div>
      <button onclick="closeModal()" style="margin-top: 15px; background-color: #7f8c8d;">Luk</button>
    </div>
  </div>

  <script>
    const days = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
    let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];
    let weekPlan = JSON.parse(localStorage.getItem('my_weekplan')) || {};
    let extraIngredients = [];

    const weekDaysContainer = document.getElementById('weekDaysContainer');
    const recipeForm = document.getElementById('recipeForm');
    const libraryGrid = document.getElementById('libraryGrid');
    const shoppingListContainer = document.getElementById('shoppingListContainer');

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // Byg ugeskemaet
    function renderWeekPlan() {
      weekDaysContainer.innerHTML = '';
      days.forEach(day => {
        const row = document.createElement('div');
        row.className = 'day-row';
        
        let options = `<option value="">-- Vælg ret --</option>`;
        recipes.forEach(r => {
          const selected = weekPlan[day] == r.id ? 'selected' : '';
          options += `<option value="${r.id}" ${selected}>${r.title}</option>`;
        });

        const selectedRecipeId = weekPlan[day];

        row.innerHTML = `
          <span class="day-label">${day}</span>
          <select class="day-select" onchange="saveDayChoice('${day}', this.value)">${options}</select>
          ${selectedRecipeId ? `<button class="view-recipe-btn" onclick="openRecipeModal(${selectedRecipeId})">Åbn 📖</button>` : ''}
        `;
        weekDaysContainer.appendChild(row);
      });
    }

    function saveDayChoice(day, recipeId) {
      if (recipeId) {
        weekPlan[day] = Number(recipeId);
      } else {
        delete weekPlan[day];
      }
      localStorage.setItem('my_weekplan', JSON.stringify(weekPlan));
      renderWeekPlan();
    }

    // Modal / Opskriftvisning
    function openRecipeModal(recipeId) {
      const recipe = recipes.find(r => r.id === recipeId);
      if (!recipe) return;

      document.getElementById('modalTitle').innerText = recipe.title;
      document.getElementById('modalImage').src = recipe.image;
      
      const ingList = document.getElementById('modalIngredients');
      ingList.innerHTML = recipe.ingredients.map(i => `<li>${i}</li>`).join('');

      const linkContainer = document.getElementById('modalLinkContainer');
      linkContainer.innerHTML = recipe.link ? `<a href="${recipe.link}" target="_blank" style="color: #3498db;">Åbn original opskrift på nettet 🔗</a>` : '';

      document.getElementById('recipeModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('recipeModal').style.display = 'none';
    }

    // Gem opskrift
    recipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newRecipe = {
        id: Date.now(),
        title: document.getElementById('title').value,
        link: document.getElementById('link').value,
        image: document.getElementById('imageUrl').value || 'https://via.placeholder.com/300x150?text=Ingen+Billede',
        ingredients: document.getElementById('ingredients').value.split('\n').filter(i => i.trim() !== '')
      };

      recipes.push(newRecipe);
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
      recipeForm.reset();
      renderAll();
    });

    function renderAll() {
      renderWeekPlan();
      renderLibrary(recipes);
    }

    function renderLibrary(recipesToRender) {
      libraryGrid.innerHTML = '';
      if (recipesToRender.length === 0) {
        libraryGrid.innerHTML = '<p>Ingen opskrifter fundet.</p>';
        return;
      }

      recipesToRender.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.innerHTML = `
          <img src="${recipe.image}" alt="${recipe.title}" onerror="this.src='https://via.placeholder.com/300x150?text=Mad'">
          <div class="recipe-card-body">
            <h3>${recipe.title}</h3>
            <button onclick="openRecipeModal(${recipe.id})" style="background-color: #3498db; margin-bottom: 5px;">Vis opskrift</button>
            <button class="delete-btn" onclick="deleteRecipe(${recipe.id})">Slet</button>
          </div>
        `;
        libraryGrid.appendChild(card);
      });
    }

    function searchRecipes() {
      const query = document.getElementById('searchBar').value.toLowerCase();
      const filtered = recipes.filter(r => r.title.toLowerCase().includes(query));
      renderLibrary(filtered);
    }

    function deleteRecipe(id) {
      recipes = recipes.filter(r => r.id !== id);
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
      renderAll();
    }

    function addExtraIngredient() {
      const input = document.getElementById('extraIngredient');
      const value = input.value.trim();
      if (value !== '') {
        extraIngredients.push(value);
        input.value = '';
        generateShoppingList();
      }
    }

    function generateShoppingList() {
      const selectedIds = Object.values(weekPlan);
      const allIngredients = [];

      recipes.forEach(recipe => {
        if (selectedIds.includes(recipe.id)) {
          allIngredients.push(...recipe.ingredients);
        }
      });

      allIngredients.push(...extraIngredients);

      if (allIngredients.length === 0) {
        shoppingListContainer.innerHTML = '<p>⚠️ Ingen varer på listen endnu. Vælg retter i ugeplanen først.</p>';
        return;
      }

      let listHTML = '<ul>';
      allIngredients.forEach(ing => {
        listHTML += `<li>${ing}</li>`;
      });
      listHTML += '</ul>';

      shoppingListContainer.innerHTML = listHTML;
    }

    // Opstart
    renderAll();
  </script>
</body>
</html>
